<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Manager</title>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/source/cookie.js"></script>
    <script src="/source/auth.js"></script>
    <script src="/source/camera.js"></script>
</head>
<body>
    <video id="CAM_low" autoplay muted></video>
    <video id="CAM_high" autoplay muted></video>
    <script>
      const SOCKET = io.connect('http://localhost:3000');

      authBindSocket(SOCKET);

      authWait().then(() => {
          CAMERA_MANAGER.enableCamera("CAM_admin_low");
      })
    </script>
</body>
</html>
